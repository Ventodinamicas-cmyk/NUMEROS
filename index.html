<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Rifa Â· 00â€“99</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root{
    --ink: #1B1330;
    --ink-soft: #362a52;
    --paper: #F7F1E1;
    --paper-dim: #EDE4CC;
    --gold: #D4A63A;
    --gold-soft: #E8C868;
    --reservado: #C97A2E;
    --pagado: #2F7A5C;
    --disponible-line: #B9AE8F;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(212,166,58,0.12), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(47,122,92,0.12), transparent 40%),
      var(--ink);
    font-family:'Space Grotesk', sans-serif;
    color: var(--paper);
    padding: 32px 16px 60px;
    display:flex;
    justify-content:center;
  }

  .app{
    width:100%;
    max-width: 820px;
  }

  /* ---------- HEADER ---------- */
  header{
    text-align:center;
    margin-bottom: 26px;
  }
  .eyebrow{
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--gold-soft);
    margin-bottom: 10px;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(38px, 8vw, 64px);
    letter-spacing: 0.04em;
    margin: 0;
    line-height: 0.95;
    color: var(--paper);
  }
  h1 span{ color: var(--gold); }
  .subtitle{
    color: #C7BBDC;
    font-size: 14px;
    margin-top: 8px;
  }

  /* ---------- CONTROLS ---------- */
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap: 10px;
    justify-content:center;
    margin: 22px 0 18px;
  }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size: 13px;
    border-radius: 999px;
    padding: 11px 20px;
    border: 1px solid transparent;
    cursor:pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  button:focus-visible{ outline: 2px solid var(--gold-soft); outline-offset: 2px; }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.97); }

  .btn-download{
    background: var(--gold);
    color: var(--ink);
  }
  .btn-reset{
    background: transparent;
    color: #E8C868;
    border-color: rgba(212,166,58,0.5);
  }

  /* ---------- SUMMARY ---------- */
  .summary{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat{
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 10px;
    text-align:center;
  }
  .stat .n{
    font-family:'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 0.02em;
  }
  .stat .l{
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:#B7ADC9;
    margin-top: 2px;
  }
  .stat.disp .n{ color: var(--paper); }
  .stat.res .n{ color: var(--reservado); }
  .stat.pag .n{ color: var(--pagado); }

  /* ---------- CAPTURE AREA (this is what gets exported as image) ---------- */
  #capture{
    background: var(--paper);
    border-radius: 18px;
    padding: 22px 18px 24px;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  #capture::before, #capture::after{
    content:"";
    position:absolute;
    left: 0; right: 0;
    height: 14px;
    background:
      radial-gradient(circle at 12px 50%, transparent 6px, var(--ink) 6.5px) ;
    background-size: 24px 14px;
    background-repeat: repeat-x;
  }
  #capture::before{ top: -7px; }
  #capture::after{ bottom: -7px; transform: rotate(180deg); }

  .capture-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom: 1.5px dashed var(--disponible-line);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  .capture-head .tag{
    font-family:'Bebas Neue', sans-serif;
    color: var(--ink);
    font-size: 20px;
    letter-spacing: 0.03em;
  }
  .capture-head .meta{
    font-size: 11px;
    color: #6b6250;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
  }
  .num{
    aspect-ratio: 1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: clamp(11px, 2.6vw, 16px);
    border-radius: 8px;
    border: 1.5px solid var(--disponible-line);
    background: var(--paper-dim);
    color: var(--ink);
    cursor: pointer;
    user-select:none;
    transition: transform .08s ease, filter .1s ease;
  }
  .num:hover{ transform: translateY(-2px); }
  .num:active{ transform: scale(0.95); }

  .num.reservado{
    background: var(--reservado);
    border-color: var(--reservado);
    color: #fff;
  }
  .num.pagado{
    background: var(--pagado);
    border-color: var(--pagado);
    color: #fff;
  }

  .legend{
    display:flex;
    gap: 16px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top: 16px;
    font-size: 12px;
    color: #6b6250;
  }
  .legend .dot{
    display:inline-block;
    width: 10px; height:10px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: -1px;
  }
  .legend .dot.disp{ background: var(--paper-dim); border: 1.5px solid var(--disponible-line); }
  .legend .dot.res{ background: var(--reservado); }
  .legend .dot.pag{ background: var(--pagado); }

  .hint{
    text-align:center;
    font-size: 12px;
    color: #8c81a3;
    margin-top: 18px;
  }

  .status-msg{
    text-align:center;
    font-size: 12px;
    color: #8c81a3;
    margin-top: 8px;
    min-height: 16px;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">Control de venta</div>
    <h1>RIFA <span>00â€“99</span></h1>
    <div class="subtitle">Toca un nÃºmero para cambiar su estado: disponible â†’ reservado â†’ pagado</div>
  </header>

  <div class="toolbar">
    <button class="btn-download" id="downloadBtn">â¬‡ Descargar imagen</button>
    <button class="btn-reset" id="resetBtn">Reiniciar todo</button>
  </div>

  <div class="summary">
    <div class="stat disp"><div class="n" id="countDisp">100</div><div class="l">Disponibles</div></div>
    <div class="stat res"><div class="n" id="countRes">0</div><div class="l">Reservados</div></div>
    <div class="stat pag"><div class="n" id="countPag">0</div><div class="l">Pagados</div></div>
  </div>

  <div id="capture">
    <div class="capture-head">
      <div class="tag">NUMEROS DISPONIBLES</div>
      <div class="meta" id="dateNow"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><span class="dot disp"></span>Disponible</span>
      <span><span class="dot res"></span>Reservado</span>
      <span><span class="dot pag"></span>Pagado</span>
    </div>
  </div>

  <div class="hint">Tu progreso se guarda automÃ¡ticamente en este dispositivo.</div>
  <div class="status-msg" id="statusMsg"></div>

</div>

<script>
  const STATES = ['disponible','reservado','pagado'];
  let numbers = Array.from({length:100}, () => 'disponible');
  const grid = document.getElementById('grid');
  const statusMsg = document.getElementById('statusMsg');

  document.getElementById('dateNow').textContent = new Date().toLocaleDateString('es-ES', { day:'2-digit', month:'long', year:'numeric' });

  function pad(n){ return n.toString().padStart(2,'0'); }

  function render(){
    grid.innerHTML = '';
    numbers.forEach((state, i) => {
      const cell = document.createElement('div');
      cell.className = 'num' + (state !== 'disponible' ? ' ' + state : '');
      cell.textContent = pad(i);
      cell.addEventListener('click', () => cycle(i));
      grid.appendChild(cell);
    });
    updateCounts();
  }

  function updateCounts(){
    const disp = numbers.filter(s => s === 'disponible').length;
    const res = numbers.filter(s => s === 'reservado').length;
    const pag = numbers.filter(s => s === 'pagado').length;
    document.getElementById('countDisp').textContent = disp;
    document.getElementById('countRes').textContent = res;
    document.getElementById('countPag').textContent = pag;
  }

  async function cycle(i){
    const idx = STATES.indexOf(numbers[i]);
    numbers[i] = STATES[(idx + 1) % STATES.length];
    render();
    await saveState();
  }

  async function saveState(){
    try{
      await window.storage.set('numeros-rifa', JSON.stringify(numbers), false);
    }catch(e){
      console.error('No se pudo guardar el estado', e);
    }
  }

  async function loadState(){
    try{
      const result = await window.storage.get('numeros-rifa', false);
      if(result && result.value){
        const parsed = JSON.parse(result.value);
        if(Array.isArray(parsed) && parsed.length === 100){
          numbers = parsed;
        }
      }
    }catch(e){
      // no hay datos guardados todavÃ­a, se usa el estado inicial
    }
    render();
  }

  document.getElementById('resetBtn').addEventListener('click', async () => {
    if(confirm('Â¿Reiniciar todos los nÃºmeros a disponible?')){
      numbers = Array.from({length:100}, () => 'disponible');
      render();
      await saveState();
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    statusMsg.textContent = 'Generando imagenâ€¦';
    try{
      const target = document.getElementById('capture');
      const canvas = await html2canvas(target, { backgroundColor: '#F7F1E1', scale: 2 });
      const link = document.createElement('a');
      link.download = 'rifa-numeros-' + new Date().toISOString().slice(0,10) + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      statusMsg.textContent = 'Imagen descargada. Ya puedes compartirla por WhatsApp.';
    }catch(e){
      statusMsg.textContent = 'No se pudo generar la imagen. Intenta de nuevo.';
      console.error(e);
    }
    setTimeout(() => statusMsg.textContent = '', 4000);
  });

  loadState();
</script>
</body>
</html>
